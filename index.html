<link rel="stylesheet" href="site.css">
<style id="scheme-vars" data-export="1"></style>
<script>/* colour theme: paint the last saved scheme before the first frame (an exported file already carries it) */(function(){try{var s=document.getElementById('scheme-vars');if(s&&!s.hasAttribute('data-export')&&!s.textContent)s.textContent=localStorage.getItem('site_scheme_css')||''}catch(e){}})();</script>
<script src="site-data.js"></script>
<script>/* first paint: no saved visitor choice -> follow the site default (dark / system) before anything is drawn, so there is no white flash */(function(){try{var r=document.documentElement,p=localStorage.getItem('site_theme');if(p==='dark'||p==='light')return;var dd=null;if(r.getAttribute('data-site-mode')!=='public')dd=localStorage.getItem('site_dark_default');if(!dd){if(window.__SITE_DATA__)dd=(window.__SITE_DATA__.theme||{}).darkDefault}if(dd==='dark'||(dd==='system'&&matchMedia('(prefers-color-scheme: dark)').matches))r.classList.add('dark')}catch(e){}})();</script>
